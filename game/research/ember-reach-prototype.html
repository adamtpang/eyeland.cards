<title>Ember Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap">

<style>
  :root{
    --felt:#3c2a1a;--felt-2:#4d3722;--rim:#8a6a3c;--rim-hi:#c9a45e;
    --board:#241a10;--wood:#5a4028;
    --parch:#efe2c6;--parch-2:#dcc9a4;--ink:#2b1e12;--ink-soft:#6b5236;
    --mana:#2f7fd4;--mana-hi:#5aa9f0;--atk:#e8b423;--hp:#c8302a;
    --fire:#d2521f;--water:#2b7fa6;--storm:#7a52b8;
    --gold:#d8b55f;--good:#5da35d;--bad:#c0453a;
  }
  *{box-sizing:border-box}
  html,body{overscroll-behavior:none}
  body{margin:0;background:var(--board);color:var(--parch);
    font-family:Lato,ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;}
  .app{max-width:1060px;margin:0 auto;padding:12px 12px 36px;display:flex;flex-direction:column;gap:10px}
  h1,h2,h3,.disp{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.01em}
  h1{font-size:clamp(26px,5vw,38px);margin:0;color:var(--rim-hi);text-wrap:balance}
  .lead{color:var(--parch-2);margin:0;max-width:64ch}
  .note{margin:0;color:var(--parch-2);font-size:14px}

  .runbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    background:linear-gradient(180deg,var(--felt-2),var(--felt));
    border:1px solid var(--rim);border-radius:8px;padding:8px 14px}
  .runbar .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rim-hi);font-weight:700}
  .runbar .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .runbar .grp{display:flex;flex-direction:column;line-height:1.15}
  .track{display:flex;gap:4px;height:20px;align-items:center}
  .node{width:24px;height:7px;border-radius:2px;background:#00000055;border:1px solid var(--rim)}
  .node.won{background:var(--good)}.node.now{background:var(--rim-hi)}.node.lost{background:var(--bad)}

  /* ---------- board ---------- */
  .board{background:radial-gradient(ellipse at 50% 50%,var(--felt-2) 0%,var(--felt) 72%);
    border:2px solid var(--rim);border-radius:12px;padding:8px 10px;
    display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 46px #00000077}

  .herorow{display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0}
  .hero{display:flex;align-items:center;gap:10px}
  .portrait{width:104px;height:104px;border-radius:50%;position:relative;
    border:4px solid var(--rim);background:radial-gradient(circle at 34% 28%,#8a6339,#33220f);
    display:grid;place-items:center;font-size:40px;box-shadow:0 6px 18px #0007}
  .portrait.big{width:112px;height:112px}
  .portrait.tgt{border-color:var(--hp);box-shadow:0 0 0 4px #c8302a66,0 6px 18px #0007;cursor:crosshair}
  .hp-gem{position:absolute;bottom:-4px;right:-4px;min-width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e8564e,var(--hp));border:3px solid #6d1712;
    display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
  .heroname{font-family:Cinzel,serif;font-size:13px;color:var(--parch-2);max-width:110px;line-height:1.15}
  .hpow{width:64px;height:64px;border-radius:50%;cursor:pointer;font:inherit;color:var(--parch);
    border:3px solid var(--rim-hi);
    background:radial-gradient(circle at 35% 30%,#4b6f9c,#1e3350);display:grid;place-items:center;
    font-size:22px;position:relative}
  .hpow:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
  .hpow:not(:disabled):hover{box-shadow:0 0 0 3px var(--rim-hi)}
  .hpow .cst{position:absolute;bottom:-5px;right:-5px;width:22px;height:22px;border-radius:50%;
    background:var(--mana);border:2px solid #14314f;font-size:11px;font-weight:700;display:grid;place-items:center}

  .lane{min-height:112px;display:flex;gap:6px;align-items:center;justify-content:center;
    background:#0000002e;border-radius:9px;padding:6px;transition:box-shadow .12s}
  .lane.drop{box-shadow:inset 0 0 0 2px var(--good)}
  .lane .empty{color:#ffffff2e;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

  .minion{width:76px;height:98px;border-radius:9px;position:relative;cursor:pointer;
    border:2px solid #00000070;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font:inherit;color:var(--ink);background:linear-gradient(180deg,var(--parch),var(--parch-2));
    transition:transform .1s,box-shadow .1s;touch-action:none}
  .minion:hover:not(:disabled){transform:translateY(-3px)}
  .minion .glyph{font-size:24px;margin-top:6px;line-height:1}
  .minion .nm{font-size:9.5px;font-weight:700;text-align:center;line-height:1.05}
  .minion .taunt{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:8.5px;
    background:var(--wood);color:var(--parch);border:1px solid var(--rim);border-radius:3px;padding:0 4px}
  .minion .a,.minion .h{position:absolute;bottom:-5px;width:23px;height:23px;border-radius:50%;
    display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;
    border:2px solid #00000055;font-variant-numeric:tabular-nums}
  .minion .a{left:-5px;background:var(--atk)}.minion .h{right:-5px;background:var(--hp)}
  .minion.ready{box-shadow:0 0 0 2px var(--good),0 0 13px #5da35d88}
  .minion.tgt{box-shadow:0 0 0 2px var(--hp);cursor:crosshair}
  .minion.dragging{opacity:.35}
  .minion:disabled{cursor:default}

  /* ---------- bottom ---------- */
  .bottom{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .manabox{display:flex;flex-direction:column;gap:4px;min-width:132px}
  .crystals{display:flex;gap:3px;flex-wrap:wrap;max-width:132px}
  .cry{width:14px;height:18px;border-radius:3px 3px 6px 6px;background:#16232f;border:1px solid #0e1822}
  .cry.on{background:linear-gradient(180deg,var(--mana-hi),var(--mana));box-shadow:0 0 6px #5aa9f099}
  .manatxt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--mana-hi);font-size:13px}
  .hand{flex:1;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;min-height:152px;align-items:flex-end}
  .endbox{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:118px}

  .pcard{width:106px;height:148px;border-radius:10px;position:relative;cursor:grab;
    border:2px solid #2b1e1288;padding:6px;font:inherit;color:var(--ink);text-align:center;
    background:linear-gradient(180deg,var(--parch),var(--parch-2));
    display:flex;flex-direction:column;gap:3px;transition:transform .12s,box-shadow .12s;touch-action:none}
  .pcard:hover:not(.dead){transform:translateY(-9px);box-shadow:0 8px 20px #0006}
  .pcard.dragging{opacity:.3}
  .pcard.unaffordable{filter:grayscale(.65) brightness(.82);cursor:not-allowed}
  .pcard .cost{position:absolute;top:-8px;left:-8px;width:29px;height:29px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--mana-hi),var(--mana));border:2px solid #14314f;
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .pcard .art{height:46px;border-radius:5px;margin-top:13px;display:grid;place-items:center;
    font-size:25px;border:1px solid #00000033}
  .art.fire{background:linear-gradient(160deg,#f0a35c,#d2521f)}
  .art.water{background:linear-gradient(160deg,#7fd0ea,#2b7fa6)}
  .art.storm{background:linear-gradient(160deg,#bb9df0,#7a52b8)}
  .art.coin{background:linear-gradient(160deg,#f5d98a,#c9a02c)}
  .pcard .nm{font-size:10.5px;font-weight:700;line-height:1.1}
  .pcard .tx{font-size:9.5px;color:var(--ink-soft);line-height:1.2;font-style:italic;flex:1;overflow:hidden}
  .pcard .a,.pcard .h{position:absolute;bottom:-6px;width:25px;height:25px;border-radius:50%;
    display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;
    border:2px solid #00000055;font-variant-numeric:tabular-nums}
  .pcard .a{left:-6px;background:var(--atk)}.pcard .h{right:-6px;background:var(--hp)}

  #ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(.92);
    filter:drop-shadow(0 10px 18px #000a);opacity:.95}

  .rope{height:9px;border-radius:5px;background:#00000055;border:1px solid var(--rim);overflow:hidden}
  .rope i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--atk));
    transition:width .95s linear}
  .rope.hot i{background:linear-gradient(90deg,var(--atk),var(--bad))}
  .timetxt{font-size:11px;color:var(--parch-2);font-variant-numeric:tabular-nums;text-align:center}

  button.act{font:inherit;font-family:Cinzel,serif;font-weight:700;cursor:pointer;letter-spacing:.03em;
    background:linear-gradient(180deg,#7c5a2e,#4e3719);color:var(--parch);
    border:2px solid var(--rim-hi);border-radius:8px;padding:9px 16px}
  button.act:hover:not(:disabled){filter:brightness(1.14)}
  button.act:disabled{opacity:.42;cursor:not-allowed}
  button.act:focus-visible{outline:2px solid var(--parch);outline-offset:2px}
  button.ghost{background:transparent;border-color:var(--rim)}

  .log{background:#00000038;border:1px solid var(--rim);border-radius:7px;padding:7px 11px;
    font-size:12.5px;color:var(--parch-2);max-height:74px;overflow-y:auto;
    display:flex;flex-direction:column-reverse;gap:1px}
  .log b{color:var(--rim-hi)}
  .hintbar{font-size:13px;color:var(--rim-hi);font-style:italic;min-height:18px;text-align:center}

  .panel{background:linear-gradient(180deg,var(--felt-2),var(--felt));border:2px solid var(--rim);
    border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .panel h2{font-size:25px;margin:0;color:var(--rim-hi)}
  .panel h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rim-hi);margin:0}
  .verdict{font-family:Cinzel,serif;font-weight:700;font-size:17px}
  .verdict.win{color:var(--good)}.verdict.lose{color:var(--bad)}
  .decklist{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);background:var(--parch-2);
    border:1px solid #00000044;border-radius:4px;padding:4px 8px;display:flex;align-items:center;gap:6px}
  .chip:hover{outline:2px solid var(--bad)}
  .chip .c{width:16px;height:16px;border-radius:50%;background:var(--mana);color:#fff;
    display:grid;place-items:center;font-size:10px;font-weight:700}
  pre.tracker{background:#00000038;border:1px solid var(--rim);border-radius:6px;padding:13px;margin:0;
    font-size:12px;line-height:1.6;overflow-x:auto;font-variant-numeric:tabular-nums;
    white-space:pre;color:var(--parch-2)}
  .qs{display:flex;flex-direction:column;gap:12px}
  .q{display:flex;gap:10px}.q .n{font-family:Cinzel,serif;font-size:19px;color:var(--rim-hi);min-width:18px}
  .q .body{display:flex;flex-direction:column;gap:4px;flex:1}
  .q label{font-weight:700;font-size:13.5px}
  .q .why{font-size:12px;color:var(--parch-2);font-style:italic}
  .q textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--parch);
    border:1px solid var(--rim);border-radius:4px;padding:7px 9px;resize:vertical;min-height:42px}
  .mullrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .pcard.mullout{filter:grayscale(1) brightness(.6)}
  .pcard.mullout::after{content:"REPLACE";position:absolute;inset:auto 0 42%;text-align:center;
    font-family:Cinzel,serif;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:660px){
    .portrait,.portrait.big{width:82px;height:82px;font-size:30px}
    .hp-gem{min-width:32px;height:32px;font-size:15px}
    .hpow{width:52px;height:52px;font-size:18px}
    .minion{width:64px;height:88px}
    .pcard{width:94px;height:136px}
    .hand{min-height:140px}
  }
</style>

<div class="app"><div id="top"></div><div id="stage"></div></div>

<script>
(function(){
"use strict";
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const top=document.getElementById("top"),stage=document.getElementById("stage");
const G_=/*glyphs*/{fire:"🔥",water:"🌊",storm:"⚡",coin:"🪙"};
const TURN_SECONDS=75;

/* ---- cards: real defs from game/src/Eyeland.Duel/Cards.cs ---- */
const C={
 glowingEmber:{n:"Glowing Ember",c:1,e:"fire",type:"m",a:1,h:2,tx:"Battlecry: Deal 1 to the enemy hero.",fx:(g,x)=>dmgHero(g,x.foe,1)},
 emberBolt:{n:"Ember Bolt",c:2,e:"fire",type:"s",tgt:"any",tx:"Deal 3. If it's your first spell this turn, draw a card.",
   fx:(g,x)=>{if(x.target)dmgMinion(g,x.target,3);else dmgHero(g,x.foe,3); if(x.me.firstSpell)draw(g,x.me,1);}},
 tideGuard:{n:"Tide Guard",c:2,e:"water",type:"m",a:1,h:4,taunt:true,tx:"Taunt."},
 squallCaller:{n:"Squall Caller",c:2,e:"storm",type:"m",a:2,h:2,tx:"Battlecry: Draw a card.",fx:(g,x)=>draw(g,x.me,1)},
 cinderWolf:{n:"Cinder Wolf",c:3,e:"fire",type:"m",a:4,h:2,tx:"A fast, fragile striker."},
 tidewisp:{n:"Tidewisp",c:3,e:"water",type:"m",a:3,h:4,tx:"Battlecry: Restore 2 Health to your hero.",fx:(g,x)=>heal(g,x.me,2)},
 stormcaller:{n:"Stormcaller Elemental",c:4,e:"storm",type:"m",a:3,h:5,tx:"A sturdy elemental body."},
 riptide:{n:"Riptide",c:4,e:"water",type:"s",tx:"Restore 5 Health and draw a card.",fx:(g,x)=>{heal(g,x.me,5);draw(g,x.me,1);}},
 eyeOfStorm:{n:"Eye of the Storm",c:5,e:"storm",type:"s",tx:"Deal 2 to all enemy minions, then draw 2.",
   fx:(g,x)=>{x.foe.board.slice().forEach(m=>dmgMinion(g,m,2));draw(g,x.me,2);}},
 rollingThunder:{n:"Rolling Thunder",c:6,e:"storm",type:"s",tgt:"minion",tx:"Deal 4 to a minion.",
   fx:(g,x)=>{if(x.target)dmgMinion(g,x.target,4);}},
 ashImp:{n:"Ash Imp",c:1,e:"fire",type:"m",a:2,h:1,tx:"Small and eager."},
 emberclaw:{n:"Emberclaw Prowler",c:2,e:"fire",type:"m",a:3,h:2,tx:"Hunts in the ash."},
 magmaShell:{n:"Magma Shell",c:3,e:"fire",type:"m",a:2,h:6,taunt:true,tx:"Taunt."},
 firestorm:{n:"Firestorm",c:4,e:"fire",type:"s",tx:"Deal 3 to all enemy minions.",
   fx:(g,x)=>x.foe.board.slice().forEach(m=>dmgMinion(g,m,3))},
 coin:{n:"The Coin",c:0,e:"coin",type:"s",tx:"Gain 1 Mana Crystal this turn.",fx:(g,x)=>{x.me.pips++;}}
};
const STARTER=[["glowingEmber",2],["emberBolt",2],["tideGuard",2],["squallCaller",2],["cinderWolf",2],
 ["stormcaller",2],["tidewisp",1],["riptide",1],["rollingThunder",1],["eyeOfStorm",1]];
const CAMPS=[
 {name:"Ember Scouts",hp:18,deck:[["ashImp",5],["emberclaw",4],["glowingEmber",4]],drops:["ashImp","glowingEmber","ashImp"]},
 {name:"Cinder Pack",hp:22,deck:[["emberclaw",5],["cinderWolf",4],["ashImp",4]],drops:["emberclaw","cinderWolf","emberclaw"]},
 {name:"Magma Warren",hp:26,deck:[["magmaShell",4],["cinderWolf",4],["emberclaw",3],["firestorm",2]],drops:["magmaShell","firestorm","magmaShell"]},
 {name:"Warden of Ember Reach",hp:30,deck:[["magmaShell",4],["cinderWolf",4],["firestorm",3],["emberclaw",3],["stormcaller",2]],drops:[]}
];
const TRAITS={1:{n:"Swarm",d:"Enemy starts with a free minion."},2:{n:"Fortified",d:"Enemy hero has +5 Health."},
 3:{n:"Rich",d:"Keep both drops after the win."},4:{n:"Ambush",d:"You mulligan one card fewer."},
 5:{n:"Volatile",d:"Enemy draws an extra card each turn."},6:{n:"Sleeping",d:"Enemy skips its first turn."}};

let uid=0,S={},g=null,timer=null,left=TURN_SECONDS;
const mk=k=>({...C[k],key:k,id:++uid});
const sh=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]];}return r;};

/* ---- engine ---- */
function say(g,t){g.log.push(t);}
function draw(g,p,n){for(let i=0;i<n;i++){
  if(!p.lib.length){p.fatigue++;p.hp-=p.fatigue;say(g,`<b>${p.name}</b> is exhausted — ${p.fatigue} damage.`);continue;}
  const c=p.lib.pop();
  if(p.hand.length>=10){say(g,`${p.name} overdraws — ${c.n} is lost.`);continue;}
  p.hand.push(c);}}
function heal(g,p,n){const b=p.hp;p.hp=Math.min(p.max,p.hp+n);if(p.hp>b)say(g,`<b>${p.name}</b> heals ${p.hp-b}.`);}
function dmgHero(g,p,n){p.hp-=n;say(g,`<b>${p.name}</b> takes ${n}.`);}
function dmgMinion(g,m,n){m.h-=n;say(g,`${m.n} takes ${n}.`);}
function cleanup(g){[g.you,g.foe].forEach(p=>{const d=p.board.filter(m=>m.h<=0);
  d.forEach(m=>say(g,`${m.n} dies.`));p.board=p.board.filter(m=>m.h>0);});}
function over(g){if(g.foe.hp<=0)g.done="win";else if(g.you.hp<=0)g.done="lose";}

function newDuel(i,trait){
  const c=CAMPS[i];let fd=[];c.deck.forEach(([k,x])=>{for(let j=0;j<x;j++)fd.push(mk(k));});
  const youFirst=Math.random()<.5;
  const G={camp:c,trait,i,
    you:{name:"You",hp:S.hp,max:30,pips:0,maxPips:0,lib:sh(S.deck.map(x=>({...x,id:++uid}))),hand:[],board:[],
         discard:[],firstSpell:true,fatigue:0,powered:false,glyph:"storm"},
    foe:{name:c.name,hp:c.hp+(trait===2?5:0),max:c.hp+(trait===2?5:0),pips:0,maxPips:0,lib:sh(fd),hand:[],board:[],
         discard:[],firstSpell:true,fatigue:0,powered:false,glyph:"fire"},
    turn:youFirst?"you":"foe",n:0,log:[],done:null,youFirst,phase:"mulligan",mullOut:new Set()};
  const mullN=(youFirst?3:4)-(trait===4?1:0);
  draw(G,G.you,mullN);draw(G,G.foe,youFirst?4:3);
  say(G,`<b>${c.name}</b> blocks the path.`);
  return G;
}
function finishMulligan(){
  const keep=g.you.hand.filter(c=>!g.mullOut.has(c.id));
  const back=g.you.hand.filter(c=>g.mullOut.has(c.id));
  g.you.lib=sh(g.you.lib.concat(back));
  g.you.hand=keep;draw(g,g.you,back.length);
  if(!g.youFirst)g.you.hand.push(mk("coin"));
  else g.foe.hand.push(mk("coin"));
  g.phase="play";
  if(g.turn==="you")startTurn("you");else{startTurn("foe");aiTurn();if(g.done)return endDuel();startTurn("you");}
  render();
}
function startTurn(who){
  const p=g[who];p.maxPips=Math.min(10,p.maxPips+1);p.pips=p.maxPips;p.firstSpell=true;p.powered=false;
  p.board.forEach(m=>m.ready=true);
  draw(g,p,who==="foe"&&g.trait===5?2:1);
  g.turn=who;g.n++;
  if(who==="you")startClock();else stopClock();
}
function playCard(card,target){
  const me=g.you,foe=g.foe;
  if(me.pips<card.c)return;
  me.pips-=card.c;me.hand=me.hand.filter(c=>c.id!==card.id);
  say(g,`You play <b>${card.n}</b>.`);
  if(card.type==="m"){if(me.board.length>=7){say(g,"Board is full.");return;}me.board.push({...card,ready:false});}
  else me.discard.push(card);
  if(card.fx)card.fx(g,{me,foe,target});
  if(card.type==="s"&&card.key!=="coin")me.firstSpell=false;
  cleanup(g);over(g);
}
function heroPower(){
  const me=g.you;if(me.powered||me.pips<2)return;
  me.pips-=2;me.powered=true;say(g,`You use <b>Stormcall</b>.`);
  const t=g.foe.board.slice().sort((a,b)=>a.h-b.h)[0];
  if(t)dmgMinion(g,t,1);else dmgHero(g,g.foe,1);
  cleanup(g);over(g);
}
function attack(att,def){
  if(!att.ready)return;
  const taunts=g.foe.board.filter(m=>m.taunt);
  if(def==="hero"){if(taunts.length){say(g,"A Taunt minion blocks the way.");return;}dmgHero(g,g.foe,att.a);}
  else{if(taunts.length&&!def.taunt){say(g,"You must attack a Taunt minion first.");return;}
    say(g,`${att.n} strikes ${def.n}.`);def.h-=att.a;att.h-=def.a;}
  att.ready=false;cleanup(g);over(g);
}
function aiTurn(){
  if(g.trait===6&&g.n<=2){say(g,`<b>${g.foe.name}</b> is sleeping.`);return;}
  let guard=0;
  while(guard++<24){
    const p=g.foe.hand.filter(c=>c.c<=g.foe.pips).sort((a,b)=>b.c-a.c);
    if(!p.length)break;
    const card=p[0];g.foe.pips-=card.c;g.foe.hand=g.foe.hand.filter(c=>c.id!==card.id);
    say(g,`<b>${g.foe.name}</b> plays ${card.n}.`);
    if(card.type==="m"){if(g.foe.board.length<7)g.foe.board.push({...card,ready:false});}
    else{g.foe.discard.push(card);
      const t=g.you.board.slice().sort((a,b)=>b.a-a.a)[0]||null;
      if(card.fx)card.fx(g,{me:g.foe,foe:g.you,target:t});}
    cleanup(g);over(g);if(g.done)return;
  }
  if(!g.foe.powered&&g.foe.pips>=2){g.foe.pips-=2;g.foe.powered=true;
    say(g,`<b>${g.foe.name}</b> uses Ember Lash.`);
    const t=g.you.board.slice().sort((a,b)=>a.h-b.h)[0];
    if(t)dmgMinion(g,t,1);else dmgHero(g,g.you,1);cleanup(g);over(g);if(g.done)return;}
  g.foe.board.filter(m=>m.ready).forEach(m=>{
    if(g.done)return;
    const tt=g.you.board.filter(t=>t.taunt);
    if(tt.length){const t=tt[0];say(g,`${m.n} strikes ${t.n}.`);t.h-=m.a;m.h-=t.a;}
    else{const tr=g.you.board.find(t=>t.h<=m.a&&t.a<m.h);
      if(tr){say(g,`${m.n} strikes ${tr.n}.`);tr.h-=m.a;m.h-=tr.a;}else dmgHero(g,g.you,m.a);}
    m.ready=false;cleanup(g);over(g);});
}
function endTurn(){
  if(g.turn!=="you"||g.done)return;
  stopClock();sel=null;
  startTurn("foe");aiTurn();
  if(g.done)return endDuel();
  startTurn("you");render();
}
function endDuel(){
  stopClock();S.hp=Math.max(0,g.you.hp);
  const won=g.done==="win";
  S.log[S.i]={won,trait:g.trait,hp:S.hp,turns:Math.ceil(g.n/2),took:null};
  if(won&&S.i<CAMPS.length-1)S.hp=Math.min(30,S.hp+5);
  S.victory=won&&S.i===CAMPS.length-1;
  S.phase=won?(S.i===CAMPS.length-1?"end":"reward"):"end";
  render();
}
/* ---- clock ---- */
function startClock(){stopClock();left=TURN_SECONDS;
  timer=setInterval(()=>{left--;paintClock();if(left<=0){stopClock();endTurn();}},1000);paintClock();}
function stopClock(){if(timer){clearInterval(timer);timer=null;}}
function paintClock(){const b=document.getElementById("rope"),t=document.getElementById("clk");
  if(!b)return;b.querySelector("i").style.width=Math.max(0,left/TURN_SECONDS*100)+"%";
  b.classList.toggle("hot",left<=15);if(t)t.textContent=left+"s";}

/* ---- drag ---- */
let drag=null,sel=null,ghost=null;
function pointOver(x,y){const e=document.elementFromPoint(x,y);return e?e.closest("[data-drop]"):null;}
function startDrag(kind,payload,srcEl,ev){
  drag={kind,payload};srcEl.classList.add("dragging");
  ghost=srcEl.cloneNode(true);ghost.id="ghost";ghost.classList.remove("dragging");
  ghost.style.width=srcEl.offsetWidth+"px";ghost.style.height=srcEl.offsetHeight+"px";
  document.body.appendChild(ghost);moveGhost(ev.clientX,ev.clientY);
  const mv=e=>{moveGhost(e.clientX,e.clientY);hilite(e.clientX,e.clientY);};
  const up=e=>{
    window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
    ghost&&ghost.remove();ghost=null;srcEl.classList.remove("dragging");
    document.querySelectorAll(".drop").forEach(n=>n.classList.remove("drop"));
    const t=pointOver(e.clientX,e.clientY);drop(t);drag=null;
  };
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
}
function moveGhost(x,y){if(ghost){ghost.style.left=x+"px";ghost.style.top=y+"px";}}
function hilite(x,y){document.querySelectorAll(".drop").forEach(n=>n.classList.remove("drop"));
  const t=pointOver(x,y);if(t&&valid(t))t.classList.add("drop");}
function valid(t){
  if(!drag)return false;const d=t.dataset.drop;
  if(drag.kind==="card"){const c=drag.payload;
    if(c.type==="m")return d==="youlane";
    if(c.tgt==="minion")return d==="foeminion";
    if(c.tgt==="any")return d==="foeminion"||d==="foehero";
    return d==="youlane"||d==="board";}
  if(drag.kind==="minion")return d==="foeminion"||d==="foehero";
  return false;
}
function drop(t){
  if(!drag)return;
  if(!t||!valid(t)){render();return;}
  const d=t.dataset.drop;
  if(drag.kind==="card"){
    const c=drag.payload;
    if(d==="foeminion")playCard(c,g.foe.board[+t.dataset.idx]);
    else if(d==="foehero")playCard(c,null);
    else playCard(c,null);
  } else {
    if(d==="foehero")attack(drag.payload,"hero");
    else attack(drag.payload,g.foe.board[+t.dataset.idx]);
  }
  if(g.done)return endDuel();
  render();
}

/* ---- render ---- */
function renderTop(){
  const nodes=CAMPS.map((_,i)=>{const r=S.log[i];let c="node";
    if(r)c+=r.won?" won":" lost";else if(i===S.i&&S.phase!=="intro"&&S.phase!=="end")c+=" now";
    return `<div class="${c}"></div>`;}).join("");
  top.replaceChildren(el(`<div class="runbar">
    <div class="grp"><span class="k">Hero</span><span class="v" style="color:var(--hp)">${Math.max(0,S.hp)} HP</span></div>
    <div class="grp"><span class="k">Deck</span><span class="v">${S.deck.length}</span></div>
    <div class="grp"><span class="k">Island</span><span class="track">${nodes}</span></div>
    <div style="flex:1"></div>
    <div class="grp"><span class="k">Ember Reach</span><span class="v disp" style="font-size:14px;color:var(--rim-hi)">Fire island</span></div>
  </div>`));
}
const cardHTML=(c,cls="")=>`<button class="pcard ${cls}">
  <span class="cost">${c.c}</span>
  <div class="art ${c.e}">${G_[c.e]}</div>
  <div class="nm">${c.n}</div><div class="tx">${c.tx||""}</div>
  ${c.type==="m"?`<span class="a">${c.a}</span><span class="h">${c.h}</span>`:""}</button>`;

function mulliganScreen(){
  const p=el(`<div class="panel">
    <h3>Camp ${S.i+1} of 4 · ${TRAITS[g.trait].n} — ${TRAITS[g.trait].d}</h3>
    <h2>${g.camp.name}</h2>
    <p class="note">${g.youFirst?"You go first.":"You go second and receive The Coin."}
      Click any card to mark it for replacement, then confirm.</p>
    <div class="mullrow" id="mr"></div>
    <div><button class="act" id="ok">Confirm mulligan</button></div>
  </div>`);
  stage.replaceChildren(p);
  const mr=p.querySelector("#mr");
  const paint=()=>mr.replaceChildren(...g.you.hand.map(c=>{
    const b=el(cardHTML(c,g.mullOut.has(c.id)?"mullout":""));
    b.addEventListener("click",()=>{g.mullOut.has(c.id)?g.mullOut.delete(c.id):g.mullOut.add(c.id);paint();});
    return b;}));
  paint();
  p.querySelector("#ok").addEventListener("click",finishMulligan);
}

function duelScreen(){
  const t=TRAITS[g.trait];
  const w=el(`<div style="display:flex;flex-direction:column;gap:9px">
    <div class="panel" style="padding:9px 15px;gap:3px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
        <h2 style="font-size:19px">${g.camp.name}</h2>
        <span class="note" style="font-size:12.5px"><b style="color:var(--rim-hi)">${t.n}</b> · ${t.d}</span>
      </div>
    </div>
    <div class="board">
      <div class="herorow">
        <div class="hero">
          <div class="heroname" style="text-align:right">${g.camp.name}<br><span style="opacity:.7">🂠 ${g.foe.hand.length}</span></div>
          <div class="portrait big" id="foeP" data-drop="foehero">${G_.fire}<span class="hp-gem">${Math.max(0,g.foe.hp)}</span></div>
        </div>
      </div>
      <div class="lane" id="foeLane" data-drop="foelane"></div>
      <div class="lane" id="youLane" data-drop="youlane"></div>
      <div class="herorow">
        <div class="hero">
          <div class="portrait big">${G_.storm}<span class="hp-gem">${Math.max(0,g.you.hp)}</span></div>
          <button class="hpow" id="hp" title="Stormcall — 2 mana: deal 1 damage">⚡<span class="cst">2</span></button>
          <div class="heroname">You<br><span style="opacity:.7">Stormcall</span></div>
        </div>
      </div>
    </div>
    <div class="hintbar" id="hint"></div>
    <div class="bottom">
      <div class="manabox">
        <div class="crystals" id="cry"></div>
        <span class="manatxt" id="mtx"></span>
      </div>
      <div class="hand" id="hand"></div>
      <div class="endbox">
        <div class="rope" id="rope"><i></i></div>
        <div class="timetxt" id="clk"></div>
        <button class="act" id="end">End Turn</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>`);
  stage.replaceChildren(w);
  const $=i=>w.querySelector("#"+i);

  $("foeLane").replaceChildren(...(g.foe.board.length?g.foe.board.map((m,idx)=>{
    const b=el(`<button class="minion ${sel?"tgt":""}" data-drop="foeminion" data-idx="${idx}" ${sel?"":"disabled"}>
      ${m.taunt?'<span class="taunt">TAUNT</span>':""}<div class="glyph">${G_[m.e]}</div>
      <div class="nm">${m.n}</div><span class="a">${m.a}</span><span class="h">${m.h}</span></button>`);
    b.addEventListener("click",()=>{if(sel){attack(sel,m);sel=null;if(g.done)return endDuel();render();}});
    return b;}):[el(`<div class="empty">no minions</div>`)]));

  $("youLane").replaceChildren(...(g.you.board.length?g.you.board.map(m=>{
    const can=m.ready&&g.turn==="you";
    const b=el(`<button class="minion ${m.ready?"ready":""} ${sel===m?"tgt":""}" ${can?"":"disabled"}>
      ${m.taunt?'<span class="taunt">TAUNT</span>':""}<div class="glyph">${G_[m.e]}</div>
      <div class="nm">${m.n}</div><span class="a">${m.a}</span><span class="h">${m.h}</span></button>`);
    if(can){
      b.addEventListener("pointerdown",e=>{e.preventDefault();startDrag("minion",m,b,e);});
      b.addEventListener("click",()=>{sel=sel===m?null:m;render();});
    }
    return b;}):[el(`<div class="empty">no minions</div>`)]));

  const fp=$("foeP");
  fp.classList.toggle("tgt",!!sel);
  if(sel)fp.addEventListener("click",()=>{attack(sel,"hero");sel=null;if(g.done)return endDuel();render();});

  $("cry").replaceChildren(...Array.from({length:Math.max(g.you.maxPips,1)},(_,i)=>
    el(`<div class="cry ${i<g.you.pips?"on":""}"></div>`)));
  $("mtx").textContent=`${g.you.pips}/${g.you.maxPips} mana`;

  $("hand").replaceChildren(...g.you.hand.map(c=>{
    const ok=c.c<=g.you.pips&&g.turn==="you";
    const b=el(cardHTML(c,ok?"":"unaffordable"));
    if(ok){
      b.addEventListener("pointerdown",e=>{e.preventDefault();startDrag("card",c,b,e);});
      b.addEventListener("click",()=>{if(!c.tgt){playCard(c,null);if(g.done)return endDuel();render();}});
    }
    return b;}));

  const hp=$("hp");hp.disabled=g.you.powered||g.you.pips<2||g.turn!=="you";
  hp.addEventListener("click",()=>{heroPower();if(g.done)return endDuel();render();});

  $("hint").textContent=sel?"Click or drag onto an enemy to attack.":
    "Drag a card onto the board to play it. Drag your minions to attack.";
  $("log").replaceChildren(...g.log.slice(-12).map(l=>el(`<div>${l}</div>`)));
  $("end").addEventListener("click",endTurn);
  paintClock();
}

function intro(){
  stage.replaceChildren(el(`<div class="panel">
    <h1>Ember <span style="color:var(--fire)">Reach</span></h1>
    <p class="lead">Three camps and a warden on one fire island. Every duel runs the real
      <strong>v0 Duel</strong> ruleset with Hearthstone's core loop on top: mulligan, The Coin,
      hero powers, fatigue, a 10-card hand cap and a 75-second rope.</p>
    <p class="note"><strong>Health carries between fights.</strong> You heal 5 after each win.
      Lose once and the run ends.</p>
    <p class="note">The only question this answers: <em>is that loop fun?</em></p>
    <div><button class="act" id="go">Begin the run</button></div></div>`));
  document.getElementById("go").addEventListener("click",()=>{S.phase="duel";render();});
}
function rewardScreen(){
  const rec=S.log[S.i],c=CAMPS[S.i];
  const three=rec.trait===1,rich=rec.trait===3;
  const keys=three?c.drops:c.drops.slice(0,2);
  const p=el(`<div class="panel">
    <h3>Cleared in ${rec.turns} turns</h3><h2>${c.name} falls</h2>
    <p class="verdict win">You march on with ${S.hp} Health.</p>
    ${rich?`<p class="note"><strong>Rich:</strong> take both cards.</p>`
          :`<p class="note">Add one of these, <em>or</em> permanently remove a card. One or the other.</p>`}
    <h3>Fire drops</h3><div class="mullrow" id="of"></div><div id="rm"></div></div>`);
  stage.replaceChildren(p);
  p.querySelector("#of").replaceChildren(...keys.map(k=>{
    const b=el(cardHTML(C[k]));
    b.addEventListener("click",()=>{
      if(rich){keys.forEach(kk=>S.deck.push(mk(kk)));rec.took="kept both";}
      else{S.deck.push(mk(k));rec.took="added "+C[k].n;}
      S.i++;S.phase="duel";render();});
    return b;}));
  if(rich)return;
  const box=p.querySelector("#rm");
  const t=el(`<div><button class="act ghost" id="x">Remove a card instead</button></div>`);
  box.replaceChildren(t);
  t.querySelector("#x").addEventListener("click",()=>{
    const l=el(`<div style="display:flex;flex-direction:column;gap:8px">
      <h3>Click a card to remove it permanently</h3><div class="decklist" id="dl"></div></div>`);
    box.replaceChildren(l);
    l.querySelector("#dl").replaceChildren(...S.deck.slice().sort((a,b)=>a.c-b.c||a.n.localeCompare(b.n)).map(cd=>{
      const ch=el(`<button class="chip"><span class="c">${cd.c}</span>${cd.n}</button>`);
      ch.addEventListener("click",()=>{S.deck=S.deck.filter(d=>d.id!==cd.id);rec.took="removed "+cd.n;
        S.i++;S.phase="duel";render();});
      return ch;}));});
}
function endScreen(){
  const rows=CAMPS.map((c,i)=>{const r=S.log[i];const nm=(c.name+"                        ").slice(0,24);
    if(!r)return `${nm} not reached`;
    return `${nm} ${r.won?"WON ":"LOST"}  ${String(r.turns).padStart(2)} turns  ${String(r.hp).padStart(2)} HP  ${TRAITS[r.trait].n}${r.took?"  ·  "+r.took:""}`;}).join("\n");
  const tracker=`RUN — Ember Reach\n\n${rows}\n\nFinal deck size: ${S.deck.length}\nResult: ${S.victory?"WARDEN DEFEATED":"RUN ENDED"}`;
  const QS=[["Did you want to play again?","Your own test, from the Milanote export."],
    ["Was any drop choice actually hard?","If every pick was obvious, deckbuilding isn't doing work yet."],
    ["Did your deck feel different by the warden?","If it felt the same, the loop's promise isn't landing."],
    ["Which camp trait was best? Which worst?","The worst is a cut-list candidate, not a balance problem."],
    ["Did you ever want to remove a card?","If never, deck thinning isn't earning its slot."]];
  const p=el(`<div class="panel">
    <h3>${S.victory?"Run complete":"Run over"}</h3>
    <h2>${S.victory?"The warden falls.":"Ember Reach keeps you."}</h2>
    <pre class="tracker">${tracker}</pre>
    <h3>Answer these before you forget</h3><div class="qs" id="qs"></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
      <button class="act" id="cp">Copy run + answers</button>
      <button class="act ghost" id="ag">Run it again</button>
      <span class="note" id="sd"></span></div></div>`);
  stage.replaceChildren(p);
  p.querySelector("#qs").replaceChildren(...QS.map(([q,why],i)=>el(`<div class="q"><div class="n">${i+1}</div>
    <div class="body"><label for="q${i}">${q}</label><div class="why">${why}</div>
    <textarea id="q${i}" rows="2"></textarea></div></div>`)));
  p.querySelector("#ag").addEventListener("click",reset);
  p.querySelector("#cp").addEventListener("click",async()=>{
    const a=QS.map(([q],i)=>`${i+1}. ${q}\n   ${document.getElementById("q"+i).value.trim()||"(blank)"}`).join("\n");
    try{await navigator.clipboard.writeText(tracker+"\n\n"+a);p.querySelector("#sd").textContent="Copied.";}
    catch{p.querySelector("#sd").textContent="Copy failed — select the text above.";}});
}
function render(){
  renderTop();
  if(S.phase==="intro")return intro();
  if(S.phase==="reward")return rewardScreen();
  if(S.phase==="end")return endScreen();
  if(S.phase==="duel"){g=newDuel(S.i,1+(Math.random()*6|0));S.phase="duelling";return mulliganScreen();}
  if(S.phase==="duelling")return g.phase==="mulligan"?mulliganScreen():duelScreen();
}
function reset(){stopClock();uid=0;S.deck=[];
  STARTER.forEach(([k,x])=>{for(let i=0;i<x;i++)S.deck.push(mk(k));});
  S.i=0;S.hp=30;S.log=[];S.phase="intro";sel=null;render();}
reset();
})();
</script>
